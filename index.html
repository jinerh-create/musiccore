<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<title>MusicCore — The Heart of Sound</title>
<link rel="manifest" href="manifest.json">
<style>
@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap");
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F4F0;--s1:#FAFBFA;--s2:#FFFFFF;--s3:#EDF0EC;
  --p:#4A9EA0;--p2:#3B8587;--pink:#E8A44A;--cyan:#8ABFCC;
  --gold:#E8A44A;--green:#7DAF8A;
  --t:#1A2332;--t2:#3D4F5E;--t3:#7A8A98;
  --border:rgba(74,158,160,0.18);--radius:14px;
  --glass:rgba(74,158,160,0.06);
  --shadow:0 8px 32px rgba(26,35,50,0.12);
}
body{background:var(--bg);color:var(--t);font-family:"Plus+Jakarta+Sans","Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;letter-spacing:.02em}
.heading,.sp-title,.auth-title,.sec-title,.fp-title,.tb-title,.modal-title{font-family:"Sora",cursive!important;font-weight:400!important;letter-spacing:.02em}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--p);border-radius:2px}
/* SPLASH */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#0A0A0F,#1A0A2E,#0A0A0F);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.sp-logo{width:80px;height:80px;background:linear-gradient(135deg,var(--p),var(--pink));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;box-shadow:0 0 40px rgba(108,99,255,.5),0 0 80px rgba(255,101,132,.3);animation:pulse-logo 2s ease-in-out infinite}
@keyframes pulse-logo{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.sp-title{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.sp-sub{font-size:12px;color:var(--t3);margin-top:6px;letter-spacing:.15em}
.sp-bar{width:160px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:40px;overflow:hidden}
.sp-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--pink));border-radius:2px;animation:fill 2.5s ease forwards}
@keyframes fill{from{width:0}to{width:100%}}
/* AUTH */
#auth{position:fixed;inset:0;background:linear-gradient(135deg,#0A0A0F 0%,#1A0A2E 50%,#0A0F1A 100%);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth-card{background:rgba(18,18,26,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:32px 28px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--p),var(--pink));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px;box-shadow:0 0 20px rgba(108,99,255,.4)}
.auth-title{font-size:20px;font-weight:900;background:linear-gradient(135deg,#fff,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-sub{font-size:12px;color:var(--t3);margin-top:4px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;letter-spacing:.06em}
.auth-tabs{display:flex;gap:0;background:var(--s2);padding:4px;border-radius:12px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border-radius:9px;border:none;background:none;color:var(--t3);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s;text-align:center}
.auth-tab.active{background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;box-shadow:0 4px 12px rgba(108,99,255,.4)}
.social-btns{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--t2);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all .2s}
.social-btn:hover{background:var(--s2);border-color:var(--p)}
.divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--t3);font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* APP LAYOUT */
#app{display:none;height:100vh;flex-direction:column}
#topbar{height:56px;background:rgba(12,12,18,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:100;flex-shrink:0}
.tb-logo{display:flex;align-items:center;gap:8px}
.tb-logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--p),var(--pink));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px}
.tb-title{font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-search{flex:1;max-width:320px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:7px 14px;color:var(--t);font-size:13px;font-family:inherit;outline:none;margin:0 10px}
.tb-search:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--glass);color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.tb-btn:hover{background:var(--s2);color:var(--t)}
.tb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pink));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:2px solid var(--p)}
/* MAIN AREA */
#main-area{display:flex;flex:1;overflow:hidden}
#sidebar{width:200px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;padding:12px 0}
#content{flex:1;overflow-y:auto;padding:20px;padding-bottom:160px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border:none;background:none;color:var(--t3);cursor:pointer;width:100%;text-align:left;font-size:13px;font-family:inherit;transition:all .2s;border-radius:0;text-decoration:none}
.sb-item:hover{background:var(--glass);color:var(--t2)}
.sb-item.active{background:rgba(108,99,255,.15);color:var(--p);font-weight:700;border-right:2px solid var(--p)}
.sb-item svg{flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1}
.sb-section{font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.12em;padding:12px 16px 4px;text-transform:uppercase}
/* BOTTOM NAV (mobile) */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(12,12,18,.98);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.bn-inner{display:flex;align-items:center;justify-content:space-around;height:60px}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;border:none;background:none;color:var(--t3);cursor:pointer;padding:6px 0;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-family:inherit;transition:color .2s}
.bn-btn.active{color:var(--p)}
.bn-btn svg{flex-shrink:0}
/* CARDS */
.glass-card{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;transition:all .2s}
.glass-card:hover{border-color:rgba(108,99,255,.3);background:rgba(255,255,255,.07)}
/* TRACK CARD */
.track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.track-card{background:var(--s2);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
.track-card:hover{transform:translateY(-3px);border-color:rgba(108,99,255,.4);box-shadow:0 8px 24px rgba(108,99,255,.2)}
.track-art{aspect-ratio:1;background:linear-gradient(135deg,var(--s3),var(--s2));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.track-art img{width:100%;height:100%;object-fit:cover}
.track-play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.track-card:hover .track-play-overlay{opacity:1}
.play-circle{width:44px;height:44px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 16px rgba(108,99,255,.5)}
.track-body{padding:10px}
.track-title{font-size:13px;font-weight:600;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.track-artist{font-size:10px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--t3)}
/* ARTIST CARD */
.artist-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:16px}
.artist-scroll::-webkit-scrollbar{display:none}
.artist-card{flex-shrink:0;text-align:center;cursor:pointer;width:100px}
.artist-av{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pink));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;margin:0 auto 8px;border:2px solid var(--border);overflow:hidden}
.artist-av img{width:100%;height:100%;object-fit:cover}
.artist-name{font-size:11px;font-weight:700;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist-followers{font-size:10px;color:var(--t3)}
/* HERO BANNER */
.hero-banner{background:linear-gradient(135deg,var(--s2),rgba(108,99,255,.2));border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.hero-banner::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(108,99,255,.2),transparent);border-radius:50%}
.hero-banner::after{content:'';position:absolute;right:60px;bottom:-60px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,101,132,.15),transparent);border-radius:50%}
/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:18px;font-weight:400;color:var(--t);font-family:"Sora",cursive!important;letter-spacing:.04em}
.sec-link{font-size:12px;color:var(--p);cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600}
/* GENRE CHIPS */
.genre-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.genre-chips::-webkit-scrollbar{display:none}
.chip{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--glass);color:var(--t2);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.chip.active,.chip:hover{background:linear-gradient(135deg,var(--p),var(--pink));border-color:transparent;color:#fff}
/* PLAYER */
#player{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,18,.98);backdrop-filter:blur(30px);border-top:1px solid var(--border);z-index:200;transition:height .3s}
#player.mini{height:70px}
#player.full{height:100vh}
.mini-player{height:70px;display:flex;align-items:center;padding:0 16px;gap:12px}
.mini-art{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--pink));flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px}
.mini-art img{width:100%;height:100%;object-fit:cover}
.mini-info{flex:1;min-width:0}
.mini-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-artist{font-size:11px;color:var(--t3)}
.mini-controls{display:flex;align-items:center;gap:6px}
.ctrl-btn{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;font-size:16px}
.ctrl-btn:hover{color:var(--t)}
.ctrl-btn.play{width:40px;height:40px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;box-shadow:0 4px 12px rgba(108,99,255,.4)}
.ctrl-btn.play:hover{transform:scale(1.05)}
/* PROGRESS */
.progress-wrap{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--s3);cursor:pointer}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--pink));transition:width .1s}
/* FULL PLAYER */
.full-player{display:none;height:100%;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;padding-top:60px;overflow-y:auto}
#player.full .full-player{display:flex}
#player.full .mini-player{display:none}
.fp-close{position:absolute;top:16px;left:16px;background:none;border:none;color:var(--t3);cursor:pointer;font-size:20px;z-index:10}
.fp-art{width:min(280px,60vw);aspect-ratio:1;border-radius:20px;background:linear-gradient(135deg,var(--p),var(--pink));display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:24px;box-shadow:0 20px 60px rgba(108,99,255,.4);overflow:hidden;flex-shrink:0}
.fp-art img{width:100%;height:100%;object-fit:cover}
.fp-info{text-align:center;margin-bottom:20px;width:100%}
.fp-title{font-size:24px;font-weight:400;margin-bottom:6px;font-family:"Sora",cursive!important}
.fp-artist{font-size:14px;color:var(--t3)}
.fp-progress{width:100%;max-width:360px;margin-bottom:12px}
.fp-bar{height:5px;background:var(--s3);border-radius:3px;cursor:pointer;position:relative;margin-bottom:6px}
.fp-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--pink));border-radius:3px}
.fp-times{display:flex;justify-content:space-between;font-size:11px;color:var(--t3)}
.fp-controls{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.fp-actions{display:flex;gap:16px}
/* WAVEFORM */
.waveform{display:flex;align-items:center;gap:1px;height:40px}
.wave-bar{width:3px;background:rgba(108,99,255,.3);border-radius:2px;transition:height .1s}
.wave-bar.active{background:var(--p)}
/* FORMS */
.form-group{margin-bottom:14px}
label{display:block;font-size:10px;font-weight:700;color:var(--t3);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--t);font-size:13px;font-family:inherit;outline:none;transition:all .2s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
select option{background:var(--s2);color:var(--t)}
/* BUTTONS */
.btn{padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;box-shadow:0 4px 16px rgba(108,99,255,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,99,255,.4)}
.btn-outline{background:transparent;color:var(--p);border:1px solid var(--p)}
.btn-ghost{background:var(--glass);color:var(--t2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--s2);color:var(--t)}
.btn-sm{padding:6px 14px;font-size:11px;border-radius:8px}
.btn-green{background:var(--green);color:#fff}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-p{background:rgba(108,99,255,.2);color:var(--p2)}
.badge-pink{background:rgba(255,101,132,.2);color:var(--pink)}
.badge-green{background:rgba(29,185,84,.2);color:var(--green)}
.badge-gold{background:rgba(255,215,0,.15);color:var(--gold)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--s1);z-index:1}
.modal-title{font-size:16px;font-weight:800}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--s1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.close-btn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:20px;line-height:1}
/* STAT CARDS */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-lbl{font-size:10px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
/* UPLOAD ZONE */
.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--p);background:rgba(108,99,255,.05)}
.upload-icon{font-size:40px;margin-bottom:12px;opacity:.6}
/* TOAST */
#toast{position:fixed;top:70px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast-item{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:12px;color:var(--t);box-shadow:var(--shadow);animation:slideInR .25s ease;display:flex;align-items:center;gap:8px;min-width:240px}
.toast-item.success{border-left:3px solid var(--green)}
.toast-item.error{border-left:3px solid var(--pink)}
.toast-item.info{border-left:3px solid var(--p)}
@keyframes slideInR{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* TRACK ROW (list view) */
.track-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s}
.track-row:hover{background:var(--glass)}
.track-row.playing{background:rgba(108,99,255,.1)}
.tr-num{width:24px;text-align:center;font-size:12px;color:var(--t3);flex-shrink:0}
.tr-art{width:42px;height:42px;border-radius:8px;background:var(--s3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px}
.tr-art img{width:100%;height:100%;object-fit:cover}
.tr-info{flex:1;min-width:0}
.tr-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-artist{font-size:11px;color:var(--t3)}
.tr-plays{font-size:11px;color:var(--t3);text-align:right;white-space:nowrap}
/* PROFILE */
.profile-header{position:relative;margin-bottom:60px}
.profile-cover{height:180px;background:linear-gradient(135deg,var(--s2),rgba(108,99,255,.3));border-radius:16px;overflow:hidden}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-av{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pink));border:4px solid var(--bg);position:absolute;bottom:-40px;left:20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;overflow:hidden}
.profile-av img{width:100%;height:100%;object-fit:cover}
/* LIVE BADGE */
.live-badge{background:var(--pink);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.08em;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--t3)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.3}
/* MOBILE */
@media(max-width:768px){
  #sidebar{display:none}
  #bottom-nav{display:block}
  .stat-row{grid-template-columns:repeat(2,1fr)}

<script>
// ===== DATA =====
const GENRES=['Pop','R&B','Hip-Hop','Rock','Electronic','Jazz','Classical','Country','Reggae','Gospel','Afrobeat','Boduberu','Dhivehi Pop','Traditional','Podcast','Beat/Instrumental'];
const MOODS=['Happy','Sad','Energetic','Chill','Romantic','Motivational','Melancholic','Party'];

const DEMO_USERS = {
  'demo@music.com':{pass:'demo123',name:'Demo User',type:'artist',avatar:'🎵',bio:'Demo account for MusicCore',followers:1240,following:89},
};

let users    = JSON.parse(localStorage.getItem('mc_users')   || '[]');
let tracks   = JSON.parse(localStorage.getItem('mc_tracks')  || '[]');
let playlists= JSON.parse(localStorage.getItem('mc_pls')     || '[]');
let podcasts = JSON.parse(localStorage.getItem('mc_pods')    || '[]');
let messages = JSON.parse(localStorage.getItem('mc_msgs')    || '[]');
let currentUser = JSON.parse(localStorage.getItem('mc_user') || 'null');
let likedTracks = JSON.parse(localStorage.getItem('mc_likes')|| '[]');

// Player state
let queue = [];
let queueIdx = 0;
let isPlaying = false;
let isShuffle = false;
let isRepeat = false;
let currentTrack = null;

const audio = document.getElementById('audio-el');
const UID = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function saveAll() {
  localStorage.setItem('mc_users',JSON.stringify(users));
  localStorage.setItem('mc_tracks',JSON.stringify(tracks));
  localStorage.setItem('mc_pls',JSON.stringify(playlists));
  localStorage.setItem('mc_pods',JSON.stringify(podcasts));
  localStorage.setItem('mc_msgs',JSON.stringify(messages));
  localStorage.setItem('mc_likes',JSON.stringify(likedTracks));
  if(currentUser) localStorage.setItem('mc_user',JSON.stringify(currentUser));
}

// ===== AUTH =====
document.getElementById('tab-signin').addEventListener('click',()=>{
  document.getElementById('signin-form').style.display='';
  document.getElementById('signup-form').style.display='none';
  document.getElementById('tab-signin').classList.add('active');
  document.getElementById('tab-signup').classList.remove('active');
});
document.getElementById('tab-signup').addEventListener('click',()=>{
  document.getElementById('signup-form').style.display='';
  document.getElementById('signin-form').style.display='none';
  document.getElementById('tab-signup').classList.add('active');
  document.getElementById('tab-signin').classList.remove('active');
});
document.getElementById('signin-btn').addEventListener('click',doSignIn);
document.getElementById('signup-btn').addEventListener('click',doSignUp);
document.getElementById('si-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doSignIn();});

function doSignIn() {
  const email=document.getElementById('si-email').value.trim().toLowerCase();
  const pass=document.getElementById('si-pass').value;
  const demo=DEMO_USERS[email];
  if(demo&&demo.pass===pass){currentUser={id:'demo',email,...demo};saveAll();showApp();return;}
  const u=users.find(x=>x.email===email&&x.password===pass);
  if(u){currentUser=u;saveAll();showApp();}
  else toast('Invalid credentials','error');
}
function doSignUp() {
  const name=document.getElementById('su-name').value.trim();
  const email=document.getElementById('su-email').value.trim().toLowerCase();
  const pass=document.getElementById('su-pass').value;
  const type=document.querySelector('input[name="utype"]:checked')?.value||'listener';
  if(!name||!email||!pass){toast('Fill all fields','error');return;}
  if(pass.length<6){toast('Password min 6 chars','error');return;}
  if(users.find(u=>u.email===email)){toast('Email already registered','error');return;}
  const u={id:UID(),name,email,password:pass,type,avatar:'🎵',bio:'',followers:0,following:0,verified:false,joinDate:new Date().toISOString(),location:'',plays:0};
  users.push(u);currentUser=u;saveAll();showApp();toast('Welcome to MusicCore! 🎵','success');
}
function socialLogin(provider) {
  const u={id:UID(),name:`${provider} User`,email:`user@${provider.toLowerCase()}.com`,type:'listener',avatar:'🎵',bio:'',followers:0,following:0,verified:false,joinDate:new Date().toISOString(),location:'',plays:0};
  users.push(u);currentUser=u;saveAll();showApp();toast(`Signed in with ${provider}!`,'success');
}
function doLogout(){currentUser=null;localStorage.removeItem('mc_user');document.getElementById('app').style.display='none';document.getElementById('auth').style.display='flex';}

function showApp() {
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='flex';
  const av=document.getElementById('tb-av');
  av.textContent=currentUser.name?.[0]?.toUpperCase()||'M';
  navigate('home');
}

// ===== NAVIGATION =====
let currentPage='home';
function navigate(page) {
  currentPage=page;
  document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.getAttribute('data-nav')===page);});
  const renders={
    home:renderHome,discover:renderDiscover,trending:renderTrending,
    library:renderLibrary,playlists:renderPlaylists,liked:renderLiked,
    upload:renderUpload,dashboard:renderDashboard,
    podcasts:renderPodcasts,live:renderLive,messages:renderMessages,
    maldives:renderMaldives,profile:renderProfile,notifications:renderNotifications,
    'ai-dj':renderAIDJ,battles:renderMusicBattles,marketplace:renderMarketplace,
    'fan-clubs':renderFanClubs,coins:renderCoins,'live-rooms':renderLiveRooms,
    academy:renderAcademy,'music-map':renderMusicMap,'creator-levels':renderCreatorLevels,
    'mc-awards':renderMCAwards,trophies:renderTrophies,
  };
  const fn=renders[page];
  document.getElementById('content').innerHTML=fn?fn():'<div class="empty"><div class="empty-icon">🎵</div><div>Coming soon</div></div>';
  window.scrollTo(0,0);
}

document.querySelectorAll('[data-nav]').forEach(btn=>{
  btn.addEventListener('click',()=>navigate(btn.getAttribute('data-nav')));
});
document.getElementById('global-search').addEventListener('input',e=>{
  if(e.target.value.length>0) navigate('discover');
});

// ===== HOME =====

let discoverGenre=null, discoverSort='newest';

  const search=document.getElementById('global-search')?.value?.toLowerCase()||'';
  let filtered=[...tracks];
  if(search) filtered=filtered.filter(t=>t.title?.toLowerCase().includes(search)||t.artistName?.toLowerCase().includes(search)||t.genre?.toLowerCase().includes(search)||t.tags?.some(tag=>tag.toLowerCase().includes(search)));
  if(discoverGenre) filtered=filtered.filter(t=>t.genre===discoverGenre);
  if(discoverSort==='newest') filtered.sort((a,b)=>new Date(b.uploadDate)-new Date(a.uploadDate));

let uploadedAudioData = null;
let uploadedCoverData = null;

function handleAudioFile(e) {
  const file=e.target.files[0];
  if(!file) return;
  const preview=document.getElementById('audio-preview');
  preview.style.display='block';
  preview.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div style="font-size:24px">🎵</div><div><div style="font-size:13px;font-weight:700">${file.name}</div><div style="font-size:11px;color:var(--t3)">${(file.size/1024/1024).toFixed(1)} MB · ${file.type}</div></div><button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="clearAudio()">✕</button></div>`;
  const reader=new FileReader();
  reader.onload=e=>{uploadedAudioData=e.target.result;};
  reader.readAsDataURL(file);
  document.getElementById('upload-zone').style.borderColor='var(--p)';
}
function handleAudioDrop(e) {
  e.preventDefault();document.getElementById('upload-zone').classList.remove('drag');
  const file=e.dataTransfer.files[0];
  if(file&&(file.type.includes('audio')||file.name.match(/\.(mp3|wav|aac|flac|ogg)$/i))){
    const dt=new DataTransfer();dt.items.add(file);
    document.getElementById('audio-file').files=dt.files;
    handleAudioFile({target:{files:[file]}});
  }
}
function clearAudio(){uploadedAudioData=null;document.getElementById('audio-preview').style.display='none';}
function handleCoverArt(e) {
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{uploadedCoverData=ev.target.result;const pr=document.getElementById('cover-preview');pr.innerHTML='';const img=document.createElement('img');img.src=ev.target.result;img.style.cssText='width:100%;height:100%;object-fit:cover';pr.appendChild(img);};
  reader.readAsDataURL(file);
}

function uploadTrack() {
  const btn = document.getElementById('publish-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Publishing...'; }
  setTimeout(() => {
    const title = document.getElementById('up-title')?.value?.trim();
    if (!title) {
      toast('Track title required', 'error');
      if (btn) { btn.disabled = false; btn.textContent = '🎵 Publish Track'; }
      return;
    }
    const dupIdx = tracks.findIndex(t => t.title === title && t.userId === currentUser?.id);
    const track = {
      id: dupIdx >= 0 ? tracks[dupIdx].id : UID(), title,
      genre: document.getElementById('up-genre')?.value,
      mood: document.getElementById('up-mood')?.value,
      desc: document.getElementById('up-desc')?.value?.trim(),
      tags: (document.getElementById('up-tags')?.value || '').split(',').map(t => t.trim()).filter(Boolean),
      lang: document.getElementById('up-lang')?.value,
      releaseDate: document.getElementById('up-date')?.value,
      visibility: document.querySelector('input[name="vis"]:checked')?.value || 'public',
      producer: document.getElementById('up-prod')?.value?.trim(),
      composer: document.getElementById('up-comp')?.value?.trim(),
      lyrics: document.getElementById('up-lyrics')?.value?.trim(),
      audioData: uploadedAudioData,
      coverArt: uploadedCoverData,
      userId: currentUser?.id,
      artistName: currentUser?.name,
      uploadDate: new Date().toISOString(),
      plays: dupIdx >= 0 ? (tracks[dupIdx].plays || 0) : 0,
      likes: dupIdx >= 0 ? (tracks[dupIdx].likes || 0) : 0,
      comments: dupIdx >= 0 ? (tracks[dupIdx].comments || []) : [],
      reposts: dupIdx >= 0 ? (tracks[dupIdx].reposts || 0) : 0
    };
    if (dupIdx >= 0) tracks[dupIdx] = track;
    else tracks.unshift(track);
    try { saveAll(); }
    catch(e) {
      track.audioData = null;
      if (dupIdx >= 0) tracks[dupIdx] = track; else tracks[0] = track;
      try { saveAll(); } catch(e2) { toast('Storage full — clear old tracks', 'error'); return; }
      toast('Track saved (audio too large for offline storage)', 'info');
    }
    uploadedAudioData = null; uploadedCoverData = null;
    toast('🎵 Track published!', 'success');
    if (btn) { btn.disabled = false; btn.textContent = '🎵 Publish Track'; }
    setTimeout(() => navigate('library'), 600);
  }, 100);
}

// ===== PLAYER =====
function playTrack(id) {
  const t=tracks.find(x=>x.id===id);
  if(!t){toast('Track not found','error');return;}
  currentTrack=t;
  t.plays=(t.plays||0)+1;
  saveAll();
  // Update player UI
  document.getElementById('mini-title').textContent=t.title;
  document.getElementById('mini-artist').textContent=t.artistName||'—';
  document.getElementById('fp-title').textContent=t.title;
  document.getElementById('fp-artist').textContent=t.artistName||'—';
  document.getElementById('fp-genre').textContent=t.genre||'Music';
  // Art
  const artHTML=t.coverArt?`<img src="${t.coverArt}" style="width:100%;height:100%;object-fit:cover">`:'🎵';
  document.getElementById('mini-art').innerHTML=artHTML;
  document.getElementById('fp-art').innerHTML=artHTML;
  // Audio
  if(t.audioData){audio.src=t.audioData;audio.play().then(()=>{isPlaying=true;updatePlayBtn();}).catch(()=>{toast('Cannot autoplay — tap play','info');});}
  else{toast('Preview mode — no audio file','info');}
  document.getElementById('player').style.display='block';
  document.getElementById('player').classList.remove('full');
  document.getElementById('player').classList.add('mini');
  generateWaveform();
  updateLikeBtn();
}

function togglePlay() {
  if(!currentTrack){toast('Select a track first','info');return;}
  if(audio.src&&audio.src!==window.location.href){
    if(isPlaying){audio.pause();isPlaying=false;}
    else{audio.play();isPlaying=true;}
  } else {isPlaying=!isPlaying;}
  updatePlayBtn();
}
function updatePlayBtn(){
  document.getElementById('btn-play').textContent=isPlaying?'⏸':'▶';
  document.getElementById('btn-play2').textContent=isPlaying?'⏸':'▶';
}
function prevTrack(){if(queue.length){queueIdx=Math.max(0,queueIdx-1);playTrack(queue[queueIdx]);}}
function nextTrack(){if(queue.length){if(isShuffle)queueIdx=Math.floor(Math.random()*queue.length);else queueIdx=Math.min(queue.length-1,queueIdx+1);playTrack(queue[queueIdx]);}}
function toggleShuffle(){isShuffle=!isShuffle;document.getElementById('btn-shuffle').style.color=isShuffle?'var(--p)':'var(--t3)';toast(isShuffle?'Shuffle on':'Shuffle off','info');}
function toggleRepeat(){isRepeat=!isRepeat;document.getElementById('btn-repeat').style.color=isRepeat?'var(--p)':'var(--t3)';toast(isRepeat?'Repeat on':'Repeat off','info');}
function expandPlayer(){document.getElementById('player').classList.remove('mini');document.getElementById('player').classList.add('full');}
function collapsePlayer(){document.getElementById('player').classList.remove('full');document.getElementById('player').classList.add('mini');}
function seekTrack(e){
  const bar=e.currentTarget;
  const pct=e.offsetX/bar.offsetWidth;
  if(audio.duration)audio.currentTime=audio.duration*pct;
}
function toggleLike(){if(currentTrack)toggleLikeTrack(currentTrack.id);}
function toggleLikeTrack(id,el){
  const idx=likedTracks.indexOf(id);
  const t=tracks.find(x=>x.id===id);
  if(idx>=0){likedTracks.splice(idx,1);if(t)t.likes=Math.max(0,(t.likes||1)-1);}
  else{likedTracks.push(id);if(t)t.likes=(t.likes||0)+1;}
  saveAll();updateLikeBtn();

function generateWaveform() {

  const bars=40;
  el.innerHTML='';
  for(let i=0;i<bars;i++){
    const h=Math.random()*28+8;

// Audio events
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const pct=(audio.currentTime/audio.duration)*100;
  document.getElementById('progress-bar').style.width=pct+'%';
  document.getElementById('fp-bar').style.width=pct+'%';
  document.getElementById('fp-cur').textContent=fmtTime(audio.currentTime);
  document.getElementById('fp-dur').textContent=fmtTime(audio.duration);
  // Animate waveform
  document.querySelectorAll('.wave-bar').forEach((b,i)=>{b.classList.toggle('active',i/40*100<pct);});
});
audio.addEventListener('ended',()=>{if(isRepeat)audio.play();else nextTrack();});
const fmtTime=s=>{if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0');};

// FIX: uploadTrack with duplicate prevention
function uploadTrackFixed() {
  const title = document.getElementById('up-title')?.value?.trim();
  const btn = document.querySelector('[onclick="uploadTrack()"]') || document.querySelector('[onclick="uploadTrackFixed()"]');
  if (!title) { toast('Track title required', 'error'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Publishing...'; }
  try {
    const track = {
      id: UID(), title,
      genre: document.getElementById('up-genre')?.value,
      mood: document.getElementById('up-mood')?.value,
      desc: document.getElementById('up-desc')?.value?.trim(),
      tags: (document.getElementById('up-tags')?.value || '').split(',').map(t => t.trim()).filter(Boolean),
      lang: document.getElementById('up-lang')?.value,
      releaseDate: document.getElementById('up-date')?.value,
      visibility: document.querySelector('input[name="vis"]:checked')?.value || 'public',
      producer: document.getElementById('up-prod')?.value?.trim(),
      composer: document.getElementById('up-comp')?.value?.trim(),
      lyrics: document.getElementById('up-lyrics')?.value?.trim(),
      audioData: uploadedAudioData,
      coverArt: uploadedCoverData,
      userId: currentUser?.id,
      artistName: currentUser?.name,
      uploadDate: new Date().toISOString(),
      plays: 0, likes: 0, comments: [], reposts: 0
    };
    // Remove duplicates by title+userId before adding
    const existingIdx = tracks.findIndex(t => t.title === title && t.userId === currentUser?.id && t.id !== track.id);
    if (existingIdx >= 0) tracks.splice(existingIdx, 1);
    tracks.unshift(track);
    try { saveAll(); } catch(e) {
      // If localStorage full, save without audio data
      track.audioData = null;
      tracks[0] = track;
      saveAll();
      toast('Track saved (audio stored in session only — file too large for offline)', 'info');
    }
    uploadedAudioData = null; uploadedCoverData = null;
    toast('🎵 Track published!', 'success');
    setTimeout(() => navigate('library'), 500);
  } catch(e) {
    toast('Error publishing: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '🎵 Publish Track'; }
  }
}

    </div>`).join('')}
  </div>`;
}

    <div style="font-size:24px;font-weight:900;background:linear-gradient(135deg,#D4AF37,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent">MusicCore Awards 2026</div>
    <div style="font-size:13px;color:var(--t3);margin-top:4px">The biggest night in digital music — vote for your favourites!</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
    ${MC_AWARDS.map(a => `
    <div style="background:linear-gradient(135deg,${a.color}22,${a.color}11);border:1px solid ${a.color}44;border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:all .2s" onclick="voteForAward('${a.id}')">
      <div style="font-size:36px;margin-bottom:8px">${a.emoji}</div>
      <div style="font-size:13px;font-weight:800;color:${a.color};margin-bottom:4px">${a.name}</div>
      <div style="font-size:11px;color:var(--t3);margin-bottom:12px;line-height:1.4">${a.desc}</div>
      <div style="font-size:11px;color:var(--t3);margin-bottom:8px">Winner: <strong style="color:${a.color}">${a.winner}</strong></div>
      <button class="btn btn-sm" style="background:${a.color};color:#fff;width:100%;border-radius:20px">🗳️ Vote Now</button>
    </div>`).join('')}
  </div>`;
}
function voteForAward(id) { const a = MC_AWARDS.find(x => x.id === id); if (a) toast(`Voted for ${a.name}! 🗳️`, 'success'); }

// ===== SEASONAL TROPHIES =====
function renderTrophies() {
  const allTrophies = [
    { id: 't1', name: 'Summer Beats 2026', emoji: '☀️', type: 'Seasonal', desc: 'Awarded for top plays during Summer 2026', earned: tracks.filter(t=>t.userId===currentUser?.id).reduce((s,t)=>s+(t.plays||0),0)>=10, rarity: 'Common', color: '#FF8C00' },
    { id: 't2', name: 'Rainy Season Artist', emoji: '🌧️', type: 'Seasonal', desc: 'Released a track during rainy season', earned: true, rarity: 'Rare', color: '#4169E1' },
    { id: 't3', name: 'New Year Anthem', emoji: '🎉', type: 'Seasonal', desc: 'Top played track on New Year', earned: false, rarity: 'Legendary', color: '#D4AF37' },
    { id: 't4', name: 'Ramadan Special', emoji: '🌙', type: 'Seasonal', desc: 'Most liked track during Ramadan', earned: false, rarity: 'Epic', color: '#9B59B6' },
    { id: 't5', name: 'Golden Microphone', emoji: '🎤', type: 'Digital', desc: 'For reaching 1,000 plays', earned: tracks.filter(t=>t.userId===currentUser?.id).reduce((s,t)=>s+(t.plays||0),0)>=1000, rarity: 'Common', color: '#D4AF37' },
    { id: 't6', name: 'Diamond Headphones', emoji: '💎', type: 'Digital', desc: 'For 10,000 total plays', earned: false, rarity: 'Legendary', color: '#00F5FF' },
    { id: 't7', name: 'Superfan Medal', emoji: '❤️', type: 'Fan Medal', desc: 'Liked 100+ tracks', earned: likedTracks.length >= 100, rarity: 'Common', color: '#FF1493' },
    { id: 't8', name: 'Ultra Fan Medal', emoji: '🏅', type: 'Fan Medal', desc: 'Followed 20+ artists', earned: (currentUser?.following||0) >= 20, rarity: 'Rare', color: '#FF6347' },
    { id: 't9', name: 'Creator Bronze', emoji: '🥉', type: 'Creator Medal', desc: 'First track reached 100 plays', earned: tracks.filter(t=>t.userId===currentUser?.id).some(t=>(t.plays||0)>=100), rarity: 'Common', color: '#CD7F32' },
    { id: 't10', name: 'Creator Silver', emoji: '🥈', type: 'Creator Medal', desc: 'First track reached 1,000 plays', earned: false, rarity: 'Rare', color: '#9CA3AF' },
    { id: 't11', name: 'Creator Gold', emoji: '🥇', type: 'Creator Medal', desc: 'First track reached 10,000 plays', earned: false, rarity: 'Epic', color: '#D4AF37' },
    { id: 't12', name: '???', emoji: '🔮', type: 'Hidden Badge', desc: 'Secret badge — keep exploring!', earned: false, rarity: 'Legendary', hidden: true, color: '#6C63FF' },
    { id: 't13', name: '???', emoji: '👻', type: 'Hidden Badge', desc: 'Only the most dedicated fans unlock this', earned: false, rarity: 'Legendary', hidden: true, color: '#FF1493' },
    { id: 't14', name: 'Night Owl', emoji: '🦉', type: 'Hidden Badge', desc: 'Discovered at midnight', earned: new Date().getHours() >= 23 || new Date().getHours() < 4, rarity: 'Rare', hidden: true, color: '#191970' },
  ];
  const earned = allTrophies.filter(t => t.earned);
  return `
  <div style="font-size:18px;font-weight:800;margin-bottom:6px">🏆 Trophies, Medals & Badges</div>
  <div style="font-size:13px;color:var(--t3);margin-bottom:16px">${earned.length} of ${allTrophies.length} earned · Collect them all!</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    ${['All','Seasonal','Digital','Fan Medal','Creator Medal','Hidden Badge'].map((t,i) => `<button class="chip ${i===0?'active':''}">${t}</button>`).join('')}
  </div>
  ${['Seasonal', 'Digital', 'Fan Medal', 'Creator Medal', 'Hidden Badge'].map(type => {
    const group = allTrophies.filter(t => t.type === type);
    const rarityColor = { Common: '#78716C', Rare: '#06B6D4', Epic: '#9333EA', Legendary: '#D4AF37' };
    return `<div style="margin-bottom:16px">
      <div class="sec-hdr"><div class="sec-title">${type === 'Seasonal' ? '🌟 ' : type === 'Digital' ? '💻 ' : type === 'Fan Medal' ? '❤️ ' : type === 'Creator Medal' ? '🎤 ' : '🔮 '}${type}s</div></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px">
        ${group.map(t => `
        <div style="background:${t.earned ? t.color + '20' : 'var(--s2)'};border:1px solid ${t.earned ? t.color + '55' : 'var(--border)'};border-radius:14px;padding:14px;text-align:center;opacity:${t.earned ? 1 : 0.45};cursor:pointer" onclick="toast('${t.earned ? t.name + ' — You earned this! 🎉' : 'Keep going to unlock this!'}','${t.earned ? 'success' : 'info'}')">
          <div style="font-size:28px;margin-bottom:6px">${t.emoji}</div>
          <div style="font-size:11px;font-weight:800;color:${t.earned ? t.color : 'var(--t3)'};margin-bottom:3px">${t.hidden && !t.earned ? '???' : t.name}</div>
          <div style="font-size:9px;color:${rarityColor[t.rarity]||'var(--t3)'};font-weight:700;margin-bottom:4px">${t.rarity}</div>
          <div style="font-size:8px;color:var(--t3);line-height:1.3">${t.hidden && !t.earned ? 'Secret — keep exploring' : t.desc}</div>
          ${t.earned ? `<div style="margin-top:6px;font-size:9px;color:${t.color};font-weight:700">✓ Earned!</div>` : ''}
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')}`;
}

// ===== INIT =====
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{
  document.getElementById('splash').classList.add('hide');
  if(currentUser) showApp();
  else document.getElementById('auth').style.display='flex';
},2500);
</script>
</body>
